services:
  - type: web
    name: code-roaster
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MODEL
        value: meta-llama/llama-3.1-8b-instruct
      - key: RATE_LIMIT
        value: "10"

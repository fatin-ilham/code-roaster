<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Roaster - TheFox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #00ffff;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #00ffff;
        }

        .subtitle {
            color: #666;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .editor-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        textarea {
            width: 100%;
            height: 300px;
            background: #111;
            border: 1px solid #00ffff;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            padding: 15px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        select {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #00ffff;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #00ffff;
            color: #000;
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #00cccc;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .roast-section {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #333;
            background: #0d0d0d;
            display: none;
        }

        .roast-section.visible {
            display: block;
        }

        .roast-output {
            white-space: pre-wrap;
            line-height: 1.8;
            color: #ff6600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error {
            color: #ff3333;
            padding: 20px;
            border: 1px solid #ff3333;
            background: rgba(255, 51, 51, 0.1);
        }

        .cached-badge {
            display: inline-block;
            background: #333;
            color: #00ff00;
            padding: 5px 10px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #666;
            font-size: 12px;
            border-top: 1px solid #333;
            margin-top: 50px;
        }

        .fox-sig {
            color: #00ffff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Code Roaster</h1>
            <div class="subtitle">AI-powered code review by TheFox</div>
        </header>

        <div class="editor-section">
            <label for="language">Language</label>
            <select id="language">
                <option value="python">Python</option>
                <option value="javascript">JavaScript</option>
                <option value="typescript">TypeScript</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
                <option value="c">C</option>
                <option value="go">Go</option>
                <option value="rust">Rust</option>
                <option value="ruby">Ruby</option>
                <option value="sql">SQL</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
            </select>

            <label for="code">Paste Your Code</label>
            <textarea id="code" placeholder="Paste your code here... TheFox is waiting."></textarea>
        </div>

        <button id="roastBtn" onclick="roastCode()">Roast My Code</button>

        <div class="roast-section" id="roastSection">
            <div id="roastOutput" class="roast-output"></div>
        </div>

        <footer>
            <p>"I've seen rootkits with more integrity." — <span class="fox-sig">TheFox</span></p>
            <p style="margin-top: 10px;">Built with Watch Dogs CTOS aesthetic</p>
        </footer>
    </div>

    <script>
        async function roastCode() {
            const code = document.getElementById('code').value;
            const language = document.getElementById('language').value;
            const roastSection = document.getElementById('roastSection');
            const roastOutput = document.getElementById('roastOutput');
            const btn = document.getElementById('roastBtn');

            if (!code.trim()) {
                alert('TheFox needs code to roast. Paste something.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'TheFox is analyzing...';
            roastSection.classList.add('visible');
            roastOutput.innerHTML = '<div class="loading">TheFox is profiling your code</div>';

            try {
                const response = await fetch('/roast', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ code, language })
                });

                const data = await response.json();

                if (response.ok) {
                    let output = '';
                    if (data.cached) {
                        output = '<span class="cached-badge">CACHED</span>\n';
                    }
                    output += data.roast;
                    roastOutput.textContent = output;
                } else {
                    roastOutput.innerHTML = `<div class="error">Error: ${data.error}</div>`;
                }
            } catch (error) {
                roastOutput.innerHTML = `<div class="error">Connection failed: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Roast My Code';
            }
        }
    </script>
</body>
</html>
